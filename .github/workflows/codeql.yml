# CodeQL: GitHub's static analysis, looking for injection, unsafe data flow
# and the like in the TypeScript, and for unsafe patterns in these workflows.
# Findings appear under the repo's Security → Code scanning tab.
#
# Code scanning is free on PUBLIC repositories only, so this does nothing
# useful while the repo is private; it starts working the day it goes public.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 6 * * 1' # Mondays: new queries find old bugs

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # to upload findings
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
