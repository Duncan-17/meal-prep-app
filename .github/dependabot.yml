# Dependabot opens pull requests to update dependencies; CI checks each one.
#
# `cooldown` waits a few days after a release before proposing it. Most
# malicious npm releases are caught and pulled within hours, so not being
# first is a cheap defence against a hijacked package.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    groups:
      # One PR for routine dev-tool bumps instead of a dozen.
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # ESLint 10 needs eslint, @eslint/js, eslint-plugin-react-hooks 7 and
      # typescript-eslint bumped together, and react-hooks 7 adds rules that
      # need code changes. Done by hand as one upgrade, not as separate PRs.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-plugin-react-hooks"
        update-types: ["version-update:semver-major"]
      # Node types should match the Node version the app runs on (.node-version = 22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
