<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Zoom is locked: this is a fixed-layout app, and pinch-zooming a tab bar
      and a month grid only ever gets in the way.

      Two honest caveats. iOS Safari ignores `user-scalable=no` in a normal
      browser tab on purpose, for accessibility — it takes effect only once the
      app is installed to the home screen. And this does block someone who
      genuinely needs to magnify text; the fix if that ever bites is to delete
      `maximum-scale` and `user-scalable`, not to work around them.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Meal Prep</title>
    <meta name="description" content="Plan batch cooking, track fridge stock, log meals." />

    <!-- The manifest link is injected by vite-plugin-pwa at build time. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" />
    <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16171a" media="(prefers-color-scheme: dark)" />

    <!-- iOS standalone bits: Safari ignores much of the manifest. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Meal Prep" />
    <!-- iOS ignores the manifest icons entirely and reads only this. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
